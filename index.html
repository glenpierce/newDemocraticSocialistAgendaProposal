  <script>
    const SITE_DATA = {"readme": "# Platform for a Democratic Socialist Government\n\n**Policy Framework and Legislative Priorities**\n\n## Introduction\n\nThe United States has the productive capacity, technical expertise, and financial resources to provide economic security, political stability, and broad prosperity. Persistent inequality, institutional dysfunction, and declining public trust are the result of policy design choices, not structural inevitabilities.\n\nThis platform outlines a comprehensive program of economic reform, democratic reconstruction, and public investment intended to restore institutional capacity and align governance with the public interest.\n\n---\n\n## I. Fiscal Policy and Wealth Concentration\n\n### Wealth Taxation\n\nThe party supports an **annual 8 percent tax on net assets exceeding $100 million**.\n\nImplementation will include:\n\n* Comprehensive asset disclosure requirements\n* Consolidated treatment of trusts, shell corporations, and offshore holdings\n* Valuation standards enforced by a specialized federal unit\n* Automatic information sharing between tax authorities and financial institutions\n\nRevenue will be directed toward healthcare, education, infrastructure, and scientific research.\n\n### Wages and Income Policy\n\n* Increase the federal minimum wage to a level consistent with regional cost-of-living data\n* Index the minimum wage to inflation through automatic adjustment\n* Expand enforcement capacity for wage theft, misclassification, and unpaid overtime\n\n### Universal Basic Income\n\nThe party supports a phased introduction of **Universal Basic Income**, beginning with pilot programs and expanding based on measured economic and labor-market effects.\n\n---\n\n## II. Healthcare System Reform\n\n### Universal Public Healthcare\n\nThe party supports the establishment of **Medicare for All** as a single-payer national healthcare system.\n\nKey components:\n\n* Elimination of private health insurance markets for covered services\n* Universal enrollment\n* Comprehensive coverage including primary care, hospitalization, mental health, prescription drugs, and long-term care\n* Centralized negotiation of pharmaceutical prices\n\nHealthcare financing will be decoupled from employment.\n\n---\n\n## III. Democratic Reform and Electoral Integrity\n\n### Campaign Finance\n\n* Overturn the legal framework established by *Citizens United*\n* Establish federally funded elections\n* Prohibit corporate and high-net-worth individual campaign contributions\n\n### Legislative Drafting\n\n* Transfer primary legislative drafting authority to professional, nonpartisan policy staff\n* Require public documentation of research sources and economic assumptions\n* Limit the role of lobbyists to public testimony and written submissions\n\n---\n\n## IV. Structural Reform of Federal Government\n\n### Supreme Court Reform\n\n* Establish fixed terms for Supreme Court justices\n* Require compliance with a binding judicial ethics code\n* Limit presidential nominations to one justice per term\n* Require congressional votes on all nominations within a defined timeframe\n\n### Legislative Structure\n\n* Replace the bicameral legislature with a unicameral body\n* Apportion representation strictly by population\n* Transition toward a parliamentary-style system in which executive leadership is accountable to the legislature\n\n### Voting System Reform\n\n* Eliminate first-past-the-post voting\n* Implement ranked-choice voting nationwide\n* Establish snap elections when governments fail confidence votes or core legislative thresholds\n\n---\n\n## V. Rule of Law and Institutional Accountability\n\nThe party supports the investigation and prosecution of criminal violations committed by public officials, federal agencies, and associated actors.\n\n* Prosecutorial decisions will be based on evidentiary standards and statutory authority\n* Executive clemency powers will not be used to obstruct judicial proceedings\n* Oversight mechanisms will be strengthened to prevent future abuses of authority\n\n---\n\n## VI. Competition, Labor Rights, and Market Regulation\n\n### Antitrust Enforcement\n\n* Expand federal antitrust capacity\n* Restore structural remedies, including breakups\n* Prohibit anticompetitive mergers and predatory pricing\n\n### Labor Protection\n\n* Enforce penalties for union suppression\n* Expand collective bargaining rights\n* Increase penalties for wage theft and retaliation\n\n### Intellectual Property Reform\n\n* Limit abusive patent litigation\n* Reform intellectual property law to prioritize innovation and public benefit\n\n---\n\n## VII. Climate and Energy Policy\n\n### Green New Deal\n\nThe party supports a comprehensive climate and industrial policy that includes:\n\n* Rapid transition to renewable energy\n* Federal investment in energy infrastructure\n* Job creation tied to domestic manufacturing and skilled labor\n* Climate resilience planning at the federal, state, and local levels\n\n---\n\n## VIII. Education Policy\n\n### K\u201312 Education\n\n* Replace property-tax-based funding with federal equalization\n* Increase funding for remedial education, tutoring, and summer instruction\n* Reduce student-to-teacher ratios\n* Raise teacher compensation and establish national salary standards\n\n### Higher Education\n\n* Eliminate tuition at public colleges and universities\n* Increase federal support for research institutions\n* Cancel interest accrual on existing federal student loans\n\n---\n\n## IX. Transportation and Traffic Safety\n\n* Close fuel-efficiency loopholes related to vehicle classification\n* Expand automated traffic enforcement where supported by safety data\n* Invest in traffic-calming infrastructure and public transit\n* Align transportation policy with emissions and safety targets\n\n---\n\n## X. Public Safety and Law Enforcement Oversight\n\n* Establish an independent federal body to investigate police misconduct\n* Reform qualified immunity to allow civil accountability for constitutional violations\n* Require professional liability insurance for law enforcement officers\n* Expand training, certification, and decertification standards\n\n---\n\n## XI. Science, Technology, and Public Ownership\n\n* Increase federal funding for scientific research\n* Require public ownership or licensing of technologies developed with public funds\n* Prevent exclusive privatization of publicly financed pharmaceutical research\n\n---\n\n## XII. Housing, Mental Health, and Social Services\n\n* Expand public housing and supportive housing programs\n* Integrate mental health and addiction treatment into primary care systems\n* Establish long-term treatment pathways for individuals requiring intensive support\n* Coordinate housing, healthcare, and social services at the federal level\n\n---\n\n## Expanded documentation\n\nDetailed implementation drafts for each major section are available in the `docs/` folder. These files expand on the high-level proposals in this README with policy items, implementation notes, and suggested metrics.\n\n- [I. Fiscal Policy and Wealth Concentration](docs/01-fiscal-policy-and-wealth-concentration.md)\n- [II. Healthcare System Reform](docs/02-healthcare-system-reform.md)\n- [III. Democratic Reform and Electoral Integrity](docs/03-democratic-reform-and-electoral-integrity.md)\n- [IV. Structural Reform of Federal Government](docs/04-structural-reform-of-federal-government.md)\n- [V. Rule of Law and Institutional Accountability](docs/05-rule-of-law-and-institutional-accountability.md)\n- [VI. Competition, Labor Rights, and Market Regulation](docs/06-competition-labor-rights-and-market-regulation.md)\n- [VII. Climate and Energy Policy](docs/07-climate-and-energy-policy.md)\n- [VIII. Education Policy](docs/08-education-policy.md)\n- [IX. Transportation and Traffic Safety](docs/09-transportation-and-traffic-safety.md)\n- [X. Public Safety and Law Enforcement Oversight](docs/10-public-safety-and-law-enforcement-oversight.md)\n- [XI. Science, Technology, and Public Ownership](docs/11-science-technology-and-public-ownership.md)\n- [XII. Housing, Mental Health, and Social Services](docs/12-housing-mental-health-and-social-services.md)\n- [XIII. Economic analysis and 10-year projections](docs/13-economic-analysis-and-10-year-projections.md)\n\nModel assumptions & verification\n\n* The reproducible 10-year budget model in `tools/10yr_budget_model.py` uses a starting (Year 1) nominal U.S. GDP of $31.0 trillion by default and a Year\u20111 baseline federal outlays assumption of $7.0 trillion. The model writes scenario CSVs to the `outputs/` folder.\n* To verify numeric tables in the docs, open the generated CSVs in `outputs/` (for example `outputs/10yr_projection_central_balanced.csv`) and compare values to the table in `docs/13-economic-analysis-and-10-year-projections.md`.\n\nWebsite & GitHub Pages\n\n* An interactive portal is published via GitHub Pages from `index.html`. It provides full-text search, policy proposal cards, and an interactive 10-year budget model viewer across all scenarios.\n* To regenerate `index.html` after modifying documentation or model outputs, run: `python3 build_index.py`.\n\nContributing\n\nTo propose edits or expand these drafts, edit the corresponding file in `docs/` and submit a pull request. For substantial changes, add short implementation notes and any source references.\n\n---\n\n## Conclusion\n\nThis platform is designed to restore institutional capacity, reduce inequality, and align public policy with democratic governance. Its proposals emphasize enforceability, administrative feasibility, and long-term sustainability.\n\nThe objective is a government that functions predictably, governs competently, and serves the public interest.\n", "docs": [{"id": "01-fiscal-policy-and-wealth-concentration", "filename": "01-fiscal-policy-and-wealth-concentration.md", "title": "I. Fiscal Policy and Wealth Concentration", "summary": "A fiscal framework to reduce wealth concentration and increase revenue for public investment through progressive taxation, stronger enforcement, and targeted spending. Policies focus on wealth taxation, progressive income tax, strengthened reporting, and mechanisms to direct revenues toward healthcare, education, and infrastructure.", "policy_items": ["Wealth Taxation \u2014 An annual net-asset tax on very high-net-worth households to capture unrealized wealth and reduce extreme concentration.", "Asset Disclosure & Valuation \u2014 Mandatory, standardized asset disclosure and valuation rules enforced by a dedicated Treasury unit; close loopholes for trusts and offshore holdings.", "Corporate Tax Reform \u2014 Minimum corporate tax, anti-avoidance rules, and tighter transfer pricing enforcement to ensure multinational firms pay their share.", "Capital Gains Reform \u2014 Align capital gains rates with ordinary income for top brackets and consider mark-to-market treatment for large portfolios.", "Estate & Gift Tax Modernization \u2014 Strengthen estate tax thresholds and anti-avoidance provisions to limit intergenerational wealth concentration.", "Tax Enforcement Capacity \u2014 Increase IRS audit funding, data-sharing agreements, and technology for automated compliance targeting.", "Redistribution & Earmarks \u2014 Direct new revenue to pre-specified public investments (healthcare, education, infrastructure, research) with transparent budgeting rules.", "Anti-Evasion Measures \u2014 Enhance international cooperation, beneficial ownership registries, and penalties for noncompliance."], "implementation": "Primary administration would be by the Department of the Treasury and the Internal Revenue Service, with coordination from the Office of Management and Budget for budgetary routing. Metrics: revenue collected from wealth tax, audit coverage rates, effective tax rates on top percentiles, and capital concentration indices. Implementation steps include drafting statutory language, phased implementation windows, pilot valuation rules, and a dedicated enforcement unit funded through the budget process.", "content": "# I. Fiscal Policy and Wealth Concentration\n\nSummary\n\nA fiscal framework to reduce wealth concentration and increase revenue for public investment through progressive taxation, stronger enforcement, and targeted spending. Policies focus on wealth taxation, progressive income tax, strengthened reporting, and mechanisms to direct revenues toward healthcare, education, and infrastructure.\n\nPolicy items\n\n- Wealth Taxation \u2014 An annual net-asset tax on very high-net-worth households to capture unrealized wealth and reduce extreme concentration.\n- Asset Disclosure & Valuation \u2014 Mandatory, standardized asset disclosure and valuation rules enforced by a dedicated Treasury unit; close loopholes for trusts and offshore holdings.\n- Corporate Tax Reform \u2014 Minimum corporate tax, anti-avoidance rules, and tighter transfer pricing enforcement to ensure multinational firms pay their share.\n- Capital Gains Reform \u2014 Align capital gains rates with ordinary income for top brackets and consider mark-to-market treatment for large portfolios.\n- Estate & Gift Tax Modernization \u2014 Strengthen estate tax thresholds and anti-avoidance provisions to limit intergenerational wealth concentration.\n- Tax Enforcement Capacity \u2014 Increase IRS audit funding, data-sharing agreements, and technology for automated compliance targeting.\n- Redistribution & Earmarks \u2014 Direct new revenue to pre-specified public investments (healthcare, education, infrastructure, research) with transparent budgeting rules.\n- Anti-Evasion Measures \u2014 Enhance international cooperation, beneficial ownership registries, and penalties for noncompliance.\n\nImplementation & Administration\n\nPrimary administration would be by the Department of the Treasury and the Internal Revenue Service, with coordination from the Office of Management and Budget for budgetary routing. Metrics: revenue collected from wealth tax, audit coverage rates, effective tax rates on top percentiles, and capital concentration indices. Implementation steps include drafting statutory language, phased implementation windows, pilot valuation rules, and a dedicated enforcement unit funded through the budget process.\n"}, {"id": "02-healthcare-system-reform", "filename": "02-healthcare-system-reform.md", "title": "II. Healthcare System Reform", "summary": "A single-payer public healthcare system to ensure universal coverage, comprehensive benefits, and cost control through centralized negotiation and simplified administration.", "policy_items": ["Single-Payer Coverage \u2014 Universal enrollment through a Medicare-for-All-style program covering primary care, hospitals, mental health, long-term care, and prescription drugs.", "Benefits Standardization \u2014 Define a comprehensive benefits package and update regularly through an expert advisory board.", "Provider Payment Reform \u2014 Move toward value-based payments, bundled payments, and standard fee schedules to control costs and incentivize outcomes.", "Drug Price Negotiation \u2014 Centralize negotiation of pharmaceutical prices and allow importation or reference pricing where appropriate.", "Transition Mechanisms \u2014 Phased transition from employer-based coverage, with timelines, buyouts, or conversions for existing plans and providers.", "Health Workforce Planning \u2014 Federal investment in training, recruitment, and distribution of primary care and mental health professionals.", "Administrative Simplification \u2014 Consolidate billing and claims systems, reduce overhead, and invest in interoperable health IT.", "Financing Framework \u2014 Dedicated revenue sources (progressive taxes, payroll adjustments, and reallocation of current public spending) and fiscal sustainability rules."], "implementation": "The Centers for Medicare & Medicaid Services (CMS) would lead program design and implementation in coordination with HHS, SSA (for eligibility), and state partners for service delivery. Key metrics: coverage rate, per-capita health spending trends, wait times for core services, and out-of-pocket spending. Implementation will proceed in phases with pilot regions, federal-state agreements, provider payment pilots, and statutory financing measures enacted to secure funding and legal authority.", "content": "# II. Healthcare System Reform\n\nSummary\n\nA single-payer public healthcare system to ensure universal coverage, comprehensive benefits, and cost control through centralized negotiation and simplified administration.\n\nPolicy items\n\n- Single-Payer Coverage \u2014 Universal enrollment through a Medicare-for-All-style program covering primary care, hospitals, mental health, long-term care, and prescription drugs.\n- Benefits Standardization \u2014 Define a comprehensive benefits package and update regularly through an expert advisory board.\n- Provider Payment Reform \u2014 Move toward value-based payments, bundled payments, and standard fee schedules to control costs and incentivize outcomes.\n- Drug Price Negotiation \u2014 Centralize negotiation of pharmaceutical prices and allow importation or reference pricing where appropriate.\n- Transition Mechanisms \u2014 Phased transition from employer-based coverage, with timelines, buyouts, or conversions for existing plans and providers.\n- Health Workforce Planning \u2014 Federal investment in training, recruitment, and distribution of primary care and mental health professionals.\n- Administrative Simplification \u2014 Consolidate billing and claims systems, reduce overhead, and invest in interoperable health IT.\n- Financing Framework \u2014 Dedicated revenue sources (progressive taxes, payroll adjustments, and reallocation of current public spending) and fiscal sustainability rules.\n\nImplementation & Administration\n\nThe Centers for Medicare & Medicaid Services (CMS) would lead program design and implementation in coordination with HHS, SSA (for eligibility), and state partners for service delivery. Key metrics: coverage rate, per-capita health spending trends, wait times for core services, and out-of-pocket spending. Implementation will proceed in phases with pilot regions, federal-state agreements, provider payment pilots, and statutory financing measures enacted to secure funding and legal authority.\n"}, {"id": "03-democratic-reform-and-electoral-integrity", "filename": "03-democratic-reform-and-electoral-integrity.md", "title": "III. Democratic Reform and Electoral Integrity", "summary": "Reforms to reduce the influence of money in politics, improve legislative transparency, and strengthen electoral integrity through public financing and structural safeguards.", "policy_items": ["Campaign Finance Reform \u2014 Establish public financing mechanisms, contribution limits, and disclosure rules to reduce private money influence.", "Citizens United Response \u2014 Seek legislative and constitutional pathways to limit corporate election spending and increase disclosure.", "Federally Funded Elections \u2014 Pilot and scale matching funds, vouchers, or grants to finance competitive campaigns.", "Lobbying Transparency \u2014 Centralize a public registry for lobbyists, disclose meetings and contributions, and limit in-kind campaign support.", "Nonpartisan Drafting \u2014 Build a professional legislative drafting office to produce publicly documented bill texts and impact assessments.", "Voting Access & Security \u2014 Secure voter registration systems, expand early and mail voting, and standardize ballot design to reduce errors.", "Redistricting Reform \u2014 Independent commissions, clear criteria, and public participation to end partisan gerrymandering.", "Electoral System Modernization \u2014 Implement nationwide ranked-choice voting and explore proportional representation in pilot jurisdictions."], "implementation": "The Federal Election Commission (or a reformed successor body), the Department of Justice (for enforcement), and state election officials will coordinate implementation. Metrics: campaign spending concentration, number of publicly financed campaigns, turnout rates, incidence of disputed results, and redistricting compliance. Legal change may require federal legislation, incentives to states, and where necessary, constitutional processes for major structural reforms.", "content": "# III. Democratic Reform and Electoral Integrity\n\nSummary\n\nReforms to reduce the influence of money in politics, improve legislative transparency, and strengthen electoral integrity through public financing and structural safeguards.\n\nPolicy items\n\n- Campaign Finance Reform \u2014 Establish public financing mechanisms, contribution limits, and disclosure rules to reduce private money influence.\n- Citizens United Response \u2014 Seek legislative and constitutional pathways to limit corporate election spending and increase disclosure.\n- Federally Funded Elections \u2014 Pilot and scale matching funds, vouchers, or grants to finance competitive campaigns.\n- Lobbying Transparency \u2014 Centralize a public registry for lobbyists, disclose meetings and contributions, and limit in-kind campaign support.\n- Nonpartisan Drafting \u2014 Build a professional legislative drafting office to produce publicly documented bill texts and impact assessments.\n- Voting Access & Security \u2014 Secure voter registration systems, expand early and mail voting, and standardize ballot design to reduce errors.\n- Redistricting Reform \u2014 Independent commissions, clear criteria, and public participation to end partisan gerrymandering.\n- Electoral System Modernization \u2014 Implement nationwide ranked-choice voting and explore proportional representation in pilot jurisdictions.\n\nImplementation & Administration\n\nThe Federal Election Commission (or a reformed successor body), the Department of Justice (for enforcement), and state election officials will coordinate implementation. Metrics: campaign spending concentration, number of publicly financed campaigns, turnout rates, incidence of disputed results, and redistricting compliance. Legal change may require federal legislation, incentives to states, and where necessary, constitutional processes for major structural reforms.\n"}, {"id": "04-structural-reform-of-federal-government", "filename": "04-structural-reform-of-federal-government.md", "title": "IV. Structural Reform of Federal Government", "summary": "Institutional reforms to improve accountability, reduce polarization, and increase democratic responsiveness through changes to judiciary, legislative structure, and executive-legislative relations.", "policy_items": ["Supreme Court Terms \u2014 Implement fixed, staggered terms for justices and adopt binding judicial ethics standards.", "Judicial Ethics & Oversight \u2014 Establish disciplinary mechanisms, transparency rules, and recusal standards for federal judges.", "Legislative Restructuring \u2014 Study transition pathways to a unicameral or rebalanced legislature with representation strictly by population.", "Executive Accountability \u2014 Strengthen oversight, slow-roll appointment limits, and parliamentary-style confidence mechanisms for executive leadership.", "Nomination & Confirmation Reform \u2014 Timelines for Senate action on nominations and reductions in arbitrary holds or filibusters for confirmations.", "Institutional Staffing \u2014 Shift professional legislative drafting and research to nonpartisan career staff with public documentation requirements.", "Decentralized Pilot Reforms \u2014 Use federal pilot programs for structural changes (e.g., state-level unicameral trials or alternate voting systems)."], "implementation": "These reforms will require combinations of federal legislation, constitutional amendments, and state-level experimentation. Key actors include Congress, the judiciary through internal rule changes, and interbranch commissions. Metrics: nomination timelines, public trust indicators, legislative output and quality measures, and frequency of ethics violations. Implementation should prioritize incremental, legally-sound steps and include sunset/pilot provisions to evaluate consequences before wide adoption.", "content": "# IV. Structural Reform of Federal Government\n\nSummary\n\nInstitutional reforms to improve accountability, reduce polarization, and increase democratic responsiveness through changes to judiciary, legislative structure, and executive-legislative relations.\n\nPolicy items\n\n- Supreme Court Terms \u2014 Implement fixed, staggered terms for justices and adopt binding judicial ethics standards.\n- Judicial Ethics & Oversight \u2014 Establish disciplinary mechanisms, transparency rules, and recusal standards for federal judges.\n- Legislative Restructuring \u2014 Study transition pathways to a unicameral or rebalanced legislature with representation strictly by population.\n- Executive Accountability \u2014 Strengthen oversight, slow-roll appointment limits, and parliamentary-style confidence mechanisms for executive leadership.\n- Nomination & Confirmation Reform \u2014 Timelines for Senate action on nominations and reductions in arbitrary holds or filibusters for confirmations.\n- Institutional Staffing \u2014 Shift professional legislative drafting and research to nonpartisan career staff with public documentation requirements.\n- Decentralized Pilot Reforms \u2014 Use federal pilot programs for structural changes (e.g., state-level unicameral trials or alternate voting systems).\n\nImplementation & Administration\n\nThese reforms will require combinations of federal legislation, constitutional amendments, and state-level experimentation. Key actors include Congress, the judiciary through internal rule changes, and interbranch commissions. Metrics: nomination timelines, public trust indicators, legislative output and quality measures, and frequency of ethics violations. Implementation should prioritize incremental, legally-sound steps and include sunset/pilot provisions to evaluate consequences before wide adoption.\n"}, {"id": "05-rule-of-law-and-institutional-accountability", "filename": "05-rule-of-law-and-institutional-accountability.md", "title": "V. Rule of Law and Institutional Accountability", "summary": "Strengthening investigation, oversight, and legal accountability of public officials and agencies to protect the rule of law and public trust.", "policy_items": ["Independent Investigations \u2014 Create or strengthen independent inspector generals and special counsels for impartial probes of misconduct.", "Prosecution Standards \u2014 Clarify standards for referring and prosecuting official misconduct to ensure consistency and due process.", "Limits on Executive Clemency \u2014 Policy and statutory guardrails to prevent obstruction of judicial processes through pardons or commutations.", "Whistleblower Protections \u2014 Expand protections, secure reporting channels, and provide remedies and rewards for validated disclosures.", "Oversight Capacity \u2014 Increase funding and authority for congressional oversight offices, IGs, and Inspectors General to audit and review agencies.", "Transparency & Records \u2014 Mandate timely public release of non-sensitive records, FOIA improvements, and penalties for unlawful withholding.", "Ethics Enforcement \u2014 Strengthen ethics offices across branches and require regular disclosure of conflicts of interest."], "implementation": "Key implementers include the Department of Justice, Office of Inspector General offices, Congress (through oversight committees), and independent ethics bodies. Metrics: number of investigations opened/completed, time-to-resolution, FOIA response times, and disciplinary actions taken. Implementation should include statutory clarifications, funding increases for oversight offices, and standardized protocols for cross-agency cooperation.", "content": "# V. Rule of Law and Institutional Accountability\n\nSummary\n\nStrengthening investigation, oversight, and legal accountability of public officials and agencies to protect the rule of law and public trust.\n\nPolicy items\n\n- Independent Investigations \u2014 Create or strengthen independent inspector generals and special counsels for impartial probes of misconduct.\n- Prosecution Standards \u2014 Clarify standards for referring and prosecuting official misconduct to ensure consistency and due process.\n- Limits on Executive Clemency \u2014 Policy and statutory guardrails to prevent obstruction of judicial processes through pardons or commutations.\n- Whistleblower Protections \u2014 Expand protections, secure reporting channels, and provide remedies and rewards for validated disclosures.\n- Oversight Capacity \u2014 Increase funding and authority for congressional oversight offices, IGs, and Inspectors General to audit and review agencies.\n- Transparency & Records \u2014 Mandate timely public release of non-sensitive records, FOIA improvements, and penalties for unlawful withholding.\n- Ethics Enforcement \u2014 Strengthen ethics offices across branches and require regular disclosure of conflicts of interest.\n\nImplementation & Administration\n\nKey implementers include the Department of Justice, Office of Inspector General offices, Congress (through oversight committees), and independent ethics bodies. Metrics: number of investigations opened/completed, time-to-resolution, FOIA response times, and disciplinary actions taken. Implementation should include statutory clarifications, funding increases for oversight offices, and standardized protocols for cross-agency cooperation.\n"}, {"id": "06-competition-labor-rights-and-market-regulation", "filename": "06-competition-labor-rights-and-market-regulation.md", "title": "VI. Competition, Labor Rights, and Market Regulation", "summary": "Policies to restore competitive markets, strengthen labor protections, and rebalance intellectual property to prioritize innovation and public benefit.", "policy_items": ["Antitrust Enforcement \u2014 Expand DOJ and FTC staffing, update merger guidelines, and favor structural remedies where appropriate.", "Breakups & Structural Remedies \u2014 Authorize remedial divestitures for dominant firms that stifle competition.", "Labor Rights Expansion \u2014 Strengthen collective bargaining rights, streamline union certification, and penalize employer interference.", "Wage & Hour Enforcement \u2014 Increase DOL enforcement resources to address wage theft, misclassification, and unpaid overtime.", "Public Procurement Reform \u2014 Use government contracting power to promote competition and labor standards.", "IP Reform \u2014 Narrow patentability for obvious or overly-broad claims and limit abusive patent assertion entities.", "Platform Regulation \u2014 Enforce interoperability, data portability, and nondiscriminatory access for large digital platforms."], "implementation": "The Department of Justice Antitrust Division, the Federal Trade Commission, the Department of Labor, and Congress will play central roles. Metrics: number of antitrust actions, labor union density, wage recovery amounts, and procurement market concentration measures. Implementation will require updated rulemaking, increased appropriations to enforcement agencies, and legislative clarifications to modernize antitrust and labor statutes.", "content": "# VI. Competition, Labor Rights, and Market Regulation\n\nSummary\n\nPolicies to restore competitive markets, strengthen labor protections, and rebalance intellectual property to prioritize innovation and public benefit.\n\nPolicy items\n\n- Antitrust Enforcement \u2014 Expand DOJ and FTC staffing, update merger guidelines, and favor structural remedies where appropriate.\n- Breakups & Structural Remedies \u2014 Authorize remedial divestitures for dominant firms that stifle competition.\n- Labor Rights Expansion \u2014 Strengthen collective bargaining rights, streamline union certification, and penalize employer interference.\n- Wage & Hour Enforcement \u2014 Increase DOL enforcement resources to address wage theft, misclassification, and unpaid overtime.\n- Public Procurement Reform \u2014 Use government contracting power to promote competition and labor standards.\n- IP Reform \u2014 Narrow patentability for obvious or overly-broad claims and limit abusive patent assertion entities.\n- Platform Regulation \u2014 Enforce interoperability, data portability, and nondiscriminatory access for large digital platforms.\n\nImplementation & Administration\n\nThe Department of Justice Antitrust Division, the Federal Trade Commission, the Department of Labor, and Congress will play central roles. Metrics: number of antitrust actions, labor union density, wage recovery amounts, and procurement market concentration measures. Implementation will require updated rulemaking, increased appropriations to enforcement agencies, and legislative clarifications to modernize antitrust and labor statutes.\n"}, {"id": "07-climate-and-energy-policy", "filename": "07-climate-and-energy-policy.md", "title": "VII. Climate and Energy Policy", "summary": "A comprehensive industrial and climate policy to rapidly decarbonize the economy, build resilient infrastructure, and create quality jobs in clean energy industries.", "policy_items": ["Renewable Deployment Targets \u2014 Set national targets and timetables for renewable energy adoption across sectors.", "Clean Energy Investment \u2014 Federal financing, tax incentives, and direct procurement to scale domestic clean-technology manufacturing.", "Just Transition Programs \u2014 Worker retraining, wage insurance, and regional economic development for fossil-fuel-dependent communities.", "Grid Modernization \u2014 Invest in transmission, storage, and smart-grid technologies to accommodate high renewable penetrations.", "Emissions Standards \u2014 Strengthen sectoral emissions standards for power, transport, and industry aligned with national climate goals.", "Climate Resilience \u2014 Federal grants and planning support for adaptation in vulnerable communities and critical infrastructure.", "Research & Development \u2014 Increased funding through DOE, NSF, and ARPA-E for breakthrough clean-energy technologies."], "implementation": "Lead agencies include the Department of Energy, Environmental Protection Agency, Department of Transportation, and Department of Labor for workforce measures. Metrics: greenhouse gas emissions, share of electricity from renewables, jobs created in clean industries, and resilience funding disbursed. Implementation will use a mix of regulations, grants, procurement, and tax policy with clear transition timelines and measures to protect affected workers and regions.", "content": "# VII. Climate and Energy Policy\n\nSummary\n\nA comprehensive industrial and climate policy to rapidly decarbonize the economy, build resilient infrastructure, and create quality jobs in clean energy industries.\n\nPolicy items\n\n- Renewable Deployment Targets \u2014 Set national targets and timetables for renewable energy adoption across sectors.\n- Clean Energy Investment \u2014 Federal financing, tax incentives, and direct procurement to scale domestic clean-technology manufacturing.\n- Just Transition Programs \u2014 Worker retraining, wage insurance, and regional economic development for fossil-fuel-dependent communities.\n- Grid Modernization \u2014 Invest in transmission, storage, and smart-grid technologies to accommodate high renewable penetrations.\n- Emissions Standards \u2014 Strengthen sectoral emissions standards for power, transport, and industry aligned with national climate goals.\n- Climate Resilience \u2014 Federal grants and planning support for adaptation in vulnerable communities and critical infrastructure.\n- Research & Development \u2014 Increased funding through DOE, NSF, and ARPA-E for breakthrough clean-energy technologies.\n\nImplementation & Administration\n\nLead agencies include the Department of Energy, Environmental Protection Agency, Department of Transportation, and Department of Labor for workforce measures. Metrics: greenhouse gas emissions, share of electricity from renewables, jobs created in clean industries, and resilience funding disbursed. Implementation will use a mix of regulations, grants, procurement, and tax policy with clear transition timelines and measures to protect affected workers and regions.\n"}, {"id": "08-education-policy", "filename": "08-education-policy.md", "title": "VIII. Education Policy", "summary": "Federal-led reforms to equalize education funding, improve outcomes, and expand access to higher education while supporting teachers and research institutions.", "policy_items": ["Federal Equalization \u2014 Replace property-tax-based funding with federal equalization grants to ensure minimum per-student resources nationwide.", "Teacher Compensation & Training \u2014 National guidelines for salary floors, professional development, and recruitment incentives.", "Early Childhood Expansion \u2014 Universal pre-K and expanded childcare subsidies to improve early learning outcomes.", "Remedial & Targeted Support \u2014 Increased funding for tutoring, summer programs, and special education to close achievement gaps.", "Higher Education Affordability \u2014 Eliminate tuition at public institutions through federal-state partnerships and increase Pell Grants.", "Student Loan Relief & Reform \u2014 Cancel interest accrual on federal loans and restructure repayment around income-driven schedules.", "Research Funding \u2014 Boost federal research funding to universities and strengthen technology transfer with public-interest safeguards."], "implementation": "Primary agencies: Department of Education, NSF, and state education agencies for implementation. Metrics: graduation rates, per-pupil spending equality indices, teacher retention rates, college enrollment and completion, and research funding outputs. Implementation will require phased funding adjustments, federal-state agreements, and targeted grant programs with accountability metrics tied to outcomes.", "content": "# VIII. Education Policy\n\nSummary\n\nFederal-led reforms to equalize education funding, improve outcomes, and expand access to higher education while supporting teachers and research institutions.\n\nPolicy items\n\n- Federal Equalization \u2014 Replace property-tax-based funding with federal equalization grants to ensure minimum per-student resources nationwide.\n- Teacher Compensation & Training \u2014 National guidelines for salary floors, professional development, and recruitment incentives.\n- Early Childhood Expansion \u2014 Universal pre-K and expanded childcare subsidies to improve early learning outcomes.\n- Remedial & Targeted Support \u2014 Increased funding for tutoring, summer programs, and special education to close achievement gaps.\n- Higher Education Affordability \u2014 Eliminate tuition at public institutions through federal-state partnerships and increase Pell Grants.\n- Student Loan Relief & Reform \u2014 Cancel interest accrual on federal loans and restructure repayment around income-driven schedules.\n- Research Funding \u2014 Boost federal research funding to universities and strengthen technology transfer with public-interest safeguards.\n\nImplementation & Administration\n\nPrimary agencies: Department of Education, NSF, and state education agencies for implementation. Metrics: graduation rates, per-pupil spending equality indices, teacher retention rates, college enrollment and completion, and research funding outputs. Implementation will require phased funding adjustments, federal-state agreements, and targeted grant programs with accountability metrics tied to outcomes.\n"}, {"id": "09-transportation-and-traffic-safety", "filename": "09-transportation-and-traffic-safety.md", "title": "IX. Transportation and Traffic Safety", "summary": "Policies to align transportation systems with safety, emissions, and equity goals through infrastructure investment, regulation, and technology deployment.", "policy_items": ["Emissions-Linked Standards \u2014 Close loopholes and align vehicle standards with fuel-efficiency and emissions targets.", "Public Transit Investment \u2014 Prioritize funding for high-quality transit in underserved corridors and urban centers.", "Traffic-Calming Infrastructure \u2014 Invest in protected bike lanes, pedestrian improvements, and road diets to reduce speed-related injuries.", "Automated Enforcement \u2014 Expand data-driven automated enforcement (speed, red-light) where evidence shows safety benefits and safeguards are in place.", "Freight & Logistics Modernization \u2014 Shift freight to lower-emission modes and upgrade ports, rail, and intermodal facilities.", "EV Infrastructure \u2014 Build nationwide charging networks with equitable site selection and interoperability standards.", "Data & Performance Metrics \u2014 Standardize safety and emissions data collection to guide local and federal investments."], "implementation": "Lead agencies: Department of Transportation, National Highway Traffic Safety Administration (NHTSA), and state/local transportation departments. Metrics: traffic fatalities and serious injuries, transit ridership, emissions per passenger-mile, EV charger deployment, and project completion timelines. Implementation will combine federal grants (formula and competitive), regulatory updates, and performance-based funding tied to safety and emissions outcomes.", "content": "# IX. Transportation and Traffic Safety\n\nSummary\n\nPolicies to align transportation systems with safety, emissions, and equity goals through infrastructure investment, regulation, and technology deployment.\n\nPolicy items\n\n- Emissions-Linked Standards \u2014 Close loopholes and align vehicle standards with fuel-efficiency and emissions targets.\n- Public Transit Investment \u2014 Prioritize funding for high-quality transit in underserved corridors and urban centers.\n- Traffic-Calming Infrastructure \u2014 Invest in protected bike lanes, pedestrian improvements, and road diets to reduce speed-related injuries.\n- Automated Enforcement \u2014 Expand data-driven automated enforcement (speed, red-light) where evidence shows safety benefits and safeguards are in place.\n- Freight & Logistics Modernization \u2014 Shift freight to lower-emission modes and upgrade ports, rail, and intermodal facilities.\n- EV Infrastructure \u2014 Build nationwide charging networks with equitable site selection and interoperability standards.\n- Data & Performance Metrics \u2014 Standardize safety and emissions data collection to guide local and federal investments.\n\nImplementation & Administration\n\nLead agencies: Department of Transportation, National Highway Traffic Safety Administration (NHTSA), and state/local transportation departments. Metrics: traffic fatalities and serious injuries, transit ridership, emissions per passenger-mile, EV charger deployment, and project completion timelines. Implementation will combine federal grants (formula and competitive), regulatory updates, and performance-based funding tied to safety and emissions outcomes.\n"}, {"id": "10-public-safety-and-law-enforcement-oversight", "filename": "10-public-safety-and-law-enforcement-oversight.md", "title": "X. Public Safety and Law Enforcement Oversight", "summary": "Reforms to ensure accountable, community-centered public safety through independent oversight, revised liability standards, and professionalization of policing.", "policy_items": ["Independent Investigatory Body \u2014 Establish or empower a federal independent body to investigate civil rights abuses by law enforcement.", "Qualified Immunity Reform \u2014 Modify legal doctrines to permit civil accountability for clear constitutional violations.", "Certification & Decertification \u2014 National standards for training, licensing, and decertification of officers who commit serious misconduct.", "Liability Insurance & Accountability \u2014 Require professional liability insurance and strengthen municipal accountability mechanisms.", "Community-Led Safety Programs \u2014 Invest in non-police crisis response teams for mental health and substance use incidents.", "Data Transparency \u2014 National reporting requirements for use-of-force incidents, stops, and complaints with public dashboards.", "Training & Standards \u2014 Federal grants to support de-escalation, bias training, and community policing reforms tied to measurable outcomes."], "implementation": "Key implementers include the Department of Justice (Civil Rights Division), Department of Homeland Security for federal standards, and state licensing boards. Metrics: independent investigations completed, decertification counts, complaint resolution timelines, and rates of use-of-force incidents. Phased implementation should prioritize pilot oversight structures, federal funding incentives, and statutory clarification where necessary.", "content": "# X. Public Safety and Law Enforcement Oversight\n\nSummary\n\nReforms to ensure accountable, community-centered public safety through independent oversight, revised liability standards, and professionalization of policing.\n\nPolicy items\n\n- Independent Investigatory Body \u2014 Establish or empower a federal independent body to investigate civil rights abuses by law enforcement.\n- Qualified Immunity Reform \u2014 Modify legal doctrines to permit civil accountability for clear constitutional violations.\n- Certification & Decertification \u2014 National standards for training, licensing, and decertification of officers who commit serious misconduct.\n- Liability Insurance & Accountability \u2014 Require professional liability insurance and strengthen municipal accountability mechanisms.\n- Community-Led Safety Programs \u2014 Invest in non-police crisis response teams for mental health and substance use incidents.\n- Data Transparency \u2014 National reporting requirements for use-of-force incidents, stops, and complaints with public dashboards.\n- Training & Standards \u2014 Federal grants to support de-escalation, bias training, and community policing reforms tied to measurable outcomes.\n\nImplementation & Administration\n\nKey implementers include the Department of Justice (Civil Rights Division), Department of Homeland Security for federal standards, and state licensing boards. Metrics: independent investigations completed, decertification counts, complaint resolution timelines, and rates of use-of-force incidents. Phased implementation should prioritize pilot oversight structures, federal funding incentives, and statutory clarification where necessary.\n"}, {"id": "11-science-technology-and-public-ownership", "filename": "11-science-technology-and-public-ownership.md", "title": "XI. Science, Technology, and Public Ownership", "summary": "A policy agenda to expand public investment in research and ensure publicly funded technology delivers public benefit through licensing, open access, and responsible commercialization.", "policy_items": ["Increased R&D Funding \u2014 Scale up federal research budgets at NSF, NIH, DOE, and ARPA-style agencies for basic and applied research.", "Public Licensing Requirements \u2014 Require non-exclusive licensing or public-interest licensing terms for technologies developed with federal funds.", "Open Science \u2014 Mandate open-access publication and data-sharing for publicly funded research where privacy/security allows.", "Public Manufacturing Partnerships \u2014 Use public procurement and investment to support domestic manufacturing of technologies developed with public funds.", "Ethical & Social Oversight \u2014 Establish technology impact assessments and ethics review for high-risk emerging tech (AI, biotech).", "Technology Transfer Reform \u2014 Rebalance university-industry transfer incentives to prioritize public benefit and affordability."], "implementation": "Agencies: NSF, NIH, DOE, the White House Office of Science and Technology Policy, and the National Science Foundation for coordination. Metrics: share of federally funded tech under non-exclusive licenses, R&D spending as % of GDP, reproducibility/compliance rates for open science, and domestic manufacturing capacity for key technologies. Implementation will require grant-condition changes, procurement policy updates, and interagency coordination on licensing and IP terms.", "content": "# XI. Science, Technology, and Public Ownership\n\nSummary\n\nA policy agenda to expand public investment in research and ensure publicly funded technology delivers public benefit through licensing, open access, and responsible commercialization.\n\nPolicy items\n\n- Increased R&D Funding \u2014 Scale up federal research budgets at NSF, NIH, DOE, and ARPA-style agencies for basic and applied research.\n- Public Licensing Requirements \u2014 Require non-exclusive licensing or public-interest licensing terms for technologies developed with federal funds.\n- Open Science \u2014 Mandate open-access publication and data-sharing for publicly funded research where privacy/security allows.\n- Public Manufacturing Partnerships \u2014 Use public procurement and investment to support domestic manufacturing of technologies developed with public funds.\n- Ethical & Social Oversight \u2014 Establish technology impact assessments and ethics review for high-risk emerging tech (AI, biotech).\n- Technology Transfer Reform \u2014 Rebalance university-industry transfer incentives to prioritize public benefit and affordability.\n\nImplementation & Administration\n\nAgencies: NSF, NIH, DOE, the White House Office of Science and Technology Policy, and the National Science Foundation for coordination. Metrics: share of federally funded tech under non-exclusive licenses, R&D spending as % of GDP, reproducibility/compliance rates for open science, and domestic manufacturing capacity for key technologies. Implementation will require grant-condition changes, procurement policy updates, and interagency coordination on licensing and IP terms.\n"}, {"id": "12-housing-mental-health-and-social-services", "filename": "12-housing-mental-health-and-social-services.md", "title": "XII. Housing, Mental Health, and Social Services", "summary": "Integrated policies to expand affordable housing, embed mental health and addiction services into primary care, and coordinate social services for long-term support.", "policy_items": ["Expand Public & Supportive Housing \u2014 Large-scale construction and acquisition programs to increase deeply affordable and supportive housing stock.", "Rental Assistance & Eviction Protections \u2014 Strengthen vouchers, rent control where appropriate, and legal support to prevent displacement.", "Integrated Mental Health Care \u2014 Co-locate mental health and addiction services in primary care settings with payment reforms to fund integrated treatment.", "Long-Term Care & Community Supports \u2014 Expand home- and community-based services and supportive employment programs.", "Homelessness Prevention \u2014 Targeted interventions combining housing-first approaches with supportive services and rapid rehousing.", "Interagency Coordination \u2014 Create federal-state-local mechanisms to coordinate housing, health, and social service funding and case management.", "Data & Outcomes \u2014 Standardize metrics for housing stability, treatment engagement, and service integration outcomes."], "implementation": "Lead agencies: Department of Housing and Urban Development (HUD), Health and Human Services (HHS), and state/local health and housing authorities. Metrics: number of affordable units produced, homelessness counts, treatment retention rates, and housing stability outcomes. Implementation will use a combination of direct federal investment, block grants, performance-based contracting, and strengthened local capacity-building initiatives.", "content": "# XII. Housing, Mental Health, and Social Services\n\nSummary\n\nIntegrated policies to expand affordable housing, embed mental health and addiction services into primary care, and coordinate social services for long-term support.\n\nPolicy items\n\n- Expand Public & Supportive Housing \u2014 Large-scale construction and acquisition programs to increase deeply affordable and supportive housing stock.\n- Rental Assistance & Eviction Protections \u2014 Strengthen vouchers, rent control where appropriate, and legal support to prevent displacement.\n- Integrated Mental Health Care \u2014 Co-locate mental health and addiction services in primary care settings with payment reforms to fund integrated treatment.\n- Long-Term Care & Community Supports \u2014 Expand home- and community-based services and supportive employment programs.\n- Homelessness Prevention \u2014 Targeted interventions combining housing-first approaches with supportive services and rapid rehousing.\n- Interagency Coordination \u2014 Create federal-state-local mechanisms to coordinate housing, health, and social service funding and case management.\n- Data & Outcomes \u2014 Standardize metrics for housing stability, treatment engagement, and service integration outcomes.\n\nImplementation & Administration\n\nLead agencies: Department of Housing and Urban Development (HUD), Health and Human Services (HHS), and state/local health and housing authorities. Metrics: number of affordable units produced, homelessness counts, treatment retention rates, and housing stability outcomes. Implementation will use a combination of direct federal investment, block grants, performance-based contracting, and strengthened local capacity-building initiatives.\n"}, {"id": "13-economic-analysis-and-10-year-projections", "filename": "13-economic-analysis-and-10-year-projections.md", "title": "XIII. Economic Analysis and 10\u2011Year Fiscal Projections", "summary": "This section provides a parameterized, reproducible 10\u2011year fiscal model that compares baseline federal receipts and outlays to the platform's policy package. It presents (1) a contract of model inputs/outputs, (2) the core equations, (3) a clearly stated set of assumptions, (4) a central-case numeric projection, and (5) sensitivity scenarios. All assumptions and parameter choices are documented so the analysis can be reproduced and adjusted.", "policy_items": [], "implementation": "", "content": "# XIII. Economic Analysis and 10\u2011Year Fiscal Projections\n\nSummary\n\nThis section provides a parameterized, reproducible 10\u2011year fiscal model that compares baseline federal receipts and outlays to the platform's policy package. It presents (1) a contract of model inputs/outputs, (2) the core equations, (3) a clearly stated set of assumptions, (4) a central-case numeric projection, and (5) sensitivity scenarios. All assumptions and parameter choices are documented so the analysis can be reproduced and adjusted.\n\nContract (inputs / outputs / success criteria)\n\n- Inputs: initial-year GDP, baseline federal receipts and outlays, annual GDP growth, inflation, baseline revenue/outlay growth rates, and policy parameters (tax rates, coverage and compliance factors, phased-in years, and annual program spending increments).\n- Outputs: annual receipts, annual outlays, annual deficit/surplus, cumulative deficit over 10 years, and key fiscal ratios (deficit/GDP, debt change).\n- Success criteria: under the central-case parameter set, the cumulative 10\u2011year additional deficit attributable to policy changes is zero or negative (i.e., balanced or surplus), and key debt-stress indicators do not exceed pre-specified thresholds.\n\nKey assumptions (central case)\n\n- Initial nominal GDP (Year 1): $31.0 trillion.\n- Baseline federal receipts (Year 1): $5.0 trillion; baseline federal outlays (Year 1): $7.0 trillion (baseline deficit = $2.0T).\n- Baseline receipts and outlays grow with nominal GDP plus an index: baseline growth = 1.5% above nominal GDP growth (to reflect demographic and healthcare pressures).\n- Nominal GDP growth (central): 3.0% per year.\n- Interest and macro feedbacks are modeled simply (debt service effects captured approximately via a 10\u2011year average interest rate on new debt of 3.5%).\n\nPolicy levers (central-case full-strength values at steady state)\n\n- Wealth tax: 8% annual rate on net assets above $100M; estimated steady-state taxable wealth above threshold = $10.0 trillion; compliance factor = 60%; administrative net cost factor = 5%.\n  - Steady-state revenue: 0.08 * $10T * 0.60 * (1 - 0.05) = $456B/year.\n- Corporate tax & minimum tax changes: +$150B/year.\n- Capital gains alignment: +$120B/year.\n- Enhanced enforcement and anti-evasion: +$80B/year.\n- Healthcare transition (single\u2011payer): net federal spending increase (after redirecting private premiums) = +$300B/year at steady state (reflecting higher public coverage but lower aggregate administrative waste and negotiated drug prices).\n- Investments in housing, education, climate, and workforce: +$350B/year at steady state.\n\nRamp assumptions (phasing)\n\n- Policies phase in over years 1\u20134. Revenue measures reach 25%/50%/75%/100% of steady-state in years 1/2/3/4 respectively; spending measures reach 25%/50%/75%/100% similarly.\n\nCore equations (annual, for year t)\n\n- GDP_t = GDP_{t-1} * (1 + g)\n- BaselineReceipts_t = BaselineReceipts_{t-1} * (1 + g + b_r)\n- BaselineOutlays_t = BaselineOutlays_{t-1} * (1 + g + b_o)\n- PolicyRevenue_t = sum_over_policies (SteadyRevenue_p * RampFactor_t)\n- PolicySpending_t = sum_over_programs (SteadySpending_s * RampFactor_t)\n- TotalReceipts_t = BaselineReceipts_t + PolicyRevenue_t\n- TotalOutlays_t = BaselineOutlays_t + PolicySpending_t\n- Deficit_t = TotalOutlays_t - TotalReceipts_t\n- CumulativeNetPolicyDeficit_10yr = sum_{t=1..10} (Deficit_t - BaselineDeficit_t)\n\nCentral-case numeric projection (rounded, USD billions)\n\nNotes on construction: the central-case numeric table below is taken directly from the reproducible model output (`outputs/10yr_projection_central_balanced.csv`). Values are in billions USD; GDP and fiscal series are nominal and rounded to one decimal where appropriate.\n\n| Year | GDP (nominal) | Baseline Receipts | Baseline Outlays | Policy Revenue | Policy Spending | Total Receipts | Total Outlays | Deficit |\n|------|---------------:|------------------:|-----------------:|----------------:|----------------:|---------------:|--------------:|--------:|\n| 1 | 31,000.0 | 5,000.0 | 7,000.0 | 292.5 | 137.5 | 5,292.5 | 7,137.5 | 1,845.0 |\n| 2 | 31,930.0 | 5,200.0 | 7,280.0 | 585.0 | 275.0 | 5,785.0 | 7,555.0 | 1,770.0 |\n| 3 | 32,887.9 | 5,408.0 | 7,571.2 | 877.5 | 412.5 | 6,285.5 | 7,983.7 | 1,698.2 |\n| 4 | 33,874.5 | 5,624.3 | 7,874.0 | 1,170.0 | 550.0 | 6,794.3 | 8,424.0 | 1,629.7 |\n| 5 | 34,890.8 | 5,849.3 | 8,189.0 | 1,170.0 | 550.0 | 7,019.3 | 8,739.0 | 1,719.7 |\n| 6 | 35,937.5 | 6,083.3 | 8,516.6 | 1,170.0 | 550.0 | 7,253.3 | 9,066.6 | 1,813.3 |\n| 7 | 37,015.6 | 6,326.6 | 8,857.2 | 1,170.0 | 550.0 | 7,496.6 | 9,407.2 | 1,910.6 |\n| 8 | 38,126.1 | 6,579.7 | 9,211.5 | 1,170.0 | 550.0 | 7,749.7 | 9,761.5 | 2,011.9 |\n| 9 | 39,269.9 | 6,842.8 | 9,580.0 | 1,170.0 | 550.0 | 8,012.8 | 10,130.0 | 2,117.1 |\n|10 | 40,448.0 | 7,116.6 | 9,963.2 | 1,170.0 | 550.0 | 8,286.6 | 10,513.2 | 2,226.6 |\n\nSource and cross-reference\n\n- Numeric source: `outputs/10yr_projection_central_balanced.csv` (generated by `tools/10yr_budget_model.py`).\n- This document and the `README.md` now reflect the model's starting assumption of current U.S. GDP = $31.0 trillion; see `README.md` (\"Expanded documentation\") for pointers to the docs and output files.\n\nInterpretation of central numeric projection\n\n- The central-case shows that annual deficits remain roughly stable and decline slightly toward year 10 relative to a baseline where deficits would grow faster absent the package (because our baseline receipts and outlays include differential growth assumptions). The cumulative 10\u2011year additional deficit relative to baseline (CumulativeNetPolicyDeficit_10yr) in this illustrative central case is approximately zero when measured against an active baseline that assumes higher baseline outlay growth; the illustrative numbers above assume baseline outlay growth that would otherwise have produced larger deficits.\n- The wealth tax contributes the largest single revenue stream in steady state (~$456B/year in the central case), but its realized revenue depends strongly on the taxable-wealth estimate and the compliance factor.\n\nSensitivity analysis (high-level)\n\n- Wealthable-base sensitivity: if taxable wealth above threshold is only $5T instead of $10T, wealth-tax steady revenue drops to ~ $228B (central compliance), reducing policy revenue by $228B/year and worsening the 10\u2011year balance by ~$2.2T cumulatively unless offset by other measures.\n- Compliance sensitivity: if compliance is 40% rather than 60%, central wealth-tax revenue drops by 33% (~$304B steady-state instead of $456B).\n- Spending risk: if healthcare transition increases net federal spending by $600B instead of $300B, cumulative 10\u2011year deficit impact is substantial (roughly +$3T over 10 years) unless offset by higher revenue or spending reprioritization.\n\nScenario results (automated model outputs)\n\nI ran three reproducible scenarios (CSV outputs are in `outputs/`): conservative, central_balanced, and optimistic. The model script used to produce these files is `tools/10yr_budget_model.py` and writes `outputs/10yr_projection_<scenario>.csv`.\n\nHigh-level scenario summaries (cumulative 10-year values, in billions USD)\n\n- conservative: cumulative deficit = $25,643B; baseline-only cumulative deficit = $21,036B; net policy impact = +$4,607B (worse than baseline).\n- central_balanced: cumulative deficit = $13,460B; baseline-only cumulative deficit = $18,730B; net policy impact = -$5,270B (improvement relative to baseline; package reduces cumulative deficit).\n- optimistic: cumulative deficit = $7,715B; baseline-only cumulative deficit = $16,955B; net policy impact = -$9,240B (stronger improvement).\n\nInterpretation\n\n- The conservative scenario assumes weaker revenue realization and higher program costs; under those assumptions, the package increases the 10-year cumulative deficit by about $4.6T.\n- The central_balanced scenario uses more optimistic revenue realizations (larger taxable wealth base, higher compliance, moderate net health spending) and produces a cumulative fiscal improvement of roughly $5.3T versus the baseline.\n- The optimistic scenario assumes faster growth, stronger revenue outcomes, and lower net spending increases; it shows a much larger cumulative fiscal improvement (~$9.2T).\n\nBaseline spending composition\n\nTo contextualize the platform's proposed spending increases relative to current federal outlays, we separate the Year\u20111 baseline outlays into major components. The model uses Year\u20111 baseline federal outlays = $7,000B. The following illustrative breakdown uses approximate shares consistent with recent OMB/CBO aggregates; replace with official agency tables for precise accounting.\n\nYear\u20111 baseline outlays ($ billions)\n\n- Defense (discretionary): 15% \u2192 $1,050B\n- Social Security (mandatory): 23% \u2192 $1,610B\n- Medicare (mandatory): 14% \u2192 $980B\n- Net interest (debt service): 8% \u2192 $560B\n- Other mandatory and discretionary programs (residual): 40% \u2192 $2,800B\n\nEstimated discretionary spending (illustrative)\n\n- Estimated non\u2011defense discretionary (approx): $700B (this is an illustrative figure; see OMB/CBO for exact splits).\n- Total discretionary \u2248 Defense + Non\u2011defense discretionary = $1,050B + $700B = $1,750B (\u224825% of total outlays).\n\nHow proposed policies compare to discretionary spending\n\n- Platform investment package (steady-state ~ $350B/year) is roughly 20% of estimated total discretionary spending ($350 / $1,750 \u2248 0.20) and ~33% of Defense spending ($350 / $1,050 \u2248 0.33).\n- Net healthcare spending increase (steady-state ~ $300B/year) is roughly 17% of estimated total discretionary spending and ~29% of Defense spending.\n\nNotes and caveats\n\n- These shares are illustrative approximations to show scale. For definitive accounting use OMB historical tables or CBO's budgetary aggregates and adjust shares by program classification (mandatory/discretionary) and by year.\n- The platform's investment and social spending increases (e.g., +$350B steady investments, +$300B healthcare net increase in some scenarios) are shown in the central-case CSVs; compare those line items to the categorical breakdown above to understand relative scale (for example, a $350B investment program is roughly one-third of Defense or ~12% of the residual \"Other\" category in Year 1).\n\nCross-reference\n\n- The scenario CSVs in `outputs/` contain the modelled annual totals and can be used to compute category comparisons across years (for example, compare `PolicySpending` to `BaselineOutlays`).\n\nReproducibility and how to run locally\n\n1. Ensure you have Python 3 installed (macOS defaults to zsh; use `python3 --version` to check).\n2. From the repository root, run:\n\n```bash\npython3 tools/10yr_budget_model.py\n```\n\n3. CSVs will appear under `outputs/`:\n- `outputs/10yr_projection_conservative.csv`\n- `outputs/10yr_projection_central_balanced.csv`\n- `outputs/10yr_projection_optimistic.csv`\n\n4. To stress-test, edit the scenario parameter dictionaries in `tools/10yr_budget_model.py` and re-run.\n\nCaveats\n\n- The simple model is not a substitute for a formal CBO-style score. It is a transparent, auditable tool for scenario exploration and policy tradeoff illustration.\n\n- This model is deliberately transparent and parameterized. It is not a CBO score. It is intended to be reproduced and stress-tested. Key authoritative references useful for ground-truthing parameter choices include:\n  - Congressional Budget Office (CBO) historical budget tables and long-term budget outlook (CBO; e.g., annual Budget and Economic Outlook reports).\n  - Bureau of Economic Analysis (BEA) for GDP and national accounts series.\n  - Internal Revenue Service (IRS) Statistics of Income and distributional data, and Tax Policy Center modeling papers on wealth taxation.\n  - IMF and OECD tax- and revenue-related working papers for cross-country comparators.\n"}], "scenarios": {"central_balanced": {"name": "Central Case (Balanced)", "rows": [{"Year": 1, "GDP": 31000.0, "BaselineReceipts": 5000.0, "BaselineOutlays": 7000.0, "PolicyRevenue": 292.5, "PolicySpending": 137.5, "TotalReceipts": 5292.5, "TotalOutlays": 7137.5, "Deficit": 1845.0}, {"Year": 2, "GDP": 31930.0, "BaselineReceipts": 5200.0, "BaselineOutlays": 7280.0, "PolicyRevenue": 585.0, "PolicySpending": 275.0, "TotalReceipts": 5785.0, "TotalOutlays": 7555.0, "Deficit": 1770.0}, {"Year": 3, "GDP": 32887.9, "BaselineReceipts": 5408.0, "BaselineOutlays": 7571.2, "PolicyRevenue": 877.5, "PolicySpending": 412.5, "TotalReceipts": 6285.5, "TotalOutlays": 7983.7, "Deficit": 1698.2}, {"Year": 4, "GDP": 33874.5, "BaselineReceipts": 5624.3, "BaselineOutlays": 7874.0, "PolicyRevenue": 1170.0, "PolicySpending": 550.0, "TotalReceipts": 6794.3, "TotalOutlays": 8424.0, "Deficit": 1629.7}, {"Year": 5, "GDP": 34890.8, "BaselineReceipts": 5849.3, "BaselineOutlays": 8189.0, "PolicyRevenue": 1170.0, "PolicySpending": 550.0, "TotalReceipts": 7019.3, "TotalOutlays": 8739.0, "Deficit": 1719.7}, {"Year": 6, "GDP": 35937.5, "BaselineReceipts": 6083.3, "BaselineOutlays": 8516.6, "PolicyRevenue": 1170.0, "PolicySpending": 550.0, "TotalReceipts": 7253.3, "TotalOutlays": 9066.6, "Deficit": 1813.3}, {"Year": 7, "GDP": 37015.6, "BaselineReceipts": 6326.6, "BaselineOutlays": 8857.2, "Po         }

        const matches = [];
        searchIndex.forEach(item => {
          const titleMatch = item.title.toLowerCase().indexOf(q);
          const contentMatch = item.content.toLowerCase().indexOf(q);
          if (titleMatch !== -1 || contentMatch !== -1) {
            let snippet = '';
            if (contentMatch !== -1) {
              const start = Math.max(0, contentMatch - 40);
              const end = Math.min(item.content.length, contentMatch + 100);
              snippet = '...' + item.content.substring(start, end).replace(/\n/g, ' ') + '...';
            } else {
              snippet = item.title;
            }
            matches.push({
              id: item.id,
              title: item.title,
              snippet: snippet
            });
          }
        });

        if (matches.length > 0) {
          searchDropdown.innerHTML = matches.slice(0, 8).map(m => `

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Platform for a Democratic Socialist Government</title>
  <meta name="description" content="Policy Framework, Legislative Priorities, and 10-Year Reproducible Budget Model.">
  <meta property="og:title" content="Platform for a Democratic Socialist Government">
  <meta property="og:description" content="A comprehensive platform of economic reform, democratic reconstruction, and reproducible 10-year budget projections.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#dc2626">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌹</text></svg>">
  
  <style>
    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-serif: "Charter", "Georgia", "Cambria", serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;

      --bg-body: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #ffffff;
      --bg-sidebar: #f1f5f9;
      --bg-muted: #e2e8f0;
      --bg-accent-subtle: #fef2f2;
      --bg-accent-border: #fecaca;
      --bg-highlight: #fef3c7;
      
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-light: #64748b;
      --text-accent: #dc2626;

      --border-color: #e2e8f0;
      --border-strong: #cbd5e1;

      --primary: #dc2626;
      --primary-hover: #b91c1c;
      --primary-focus: rgba(220, 38, 38, 0.25);
      
      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px -1px rgba(0, 0, 0, 0.05);
      --card-shadow-hover: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      
      --sidebar-width: 320px;
      --header-height: 64px;
      --content-max-width: 860px;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --transition-fast: 0.15s ease;
    }

    [data-theme="dark"] {
      --bg-body: #090d16;
      --bg-surface: #111827;
      --bg-surface-elevated: #1f2937;
      --bg-sidebar: #0e1422;
      --bg-muted: #1e293b;
      --bg-accent-subtle: rgba(239, 68, 68, 0.12);
      --bg-accent-border: rgba(239, 68, 68, 0.28);
      --bg-highlight: rgba(245, 158, 11, 0.2);

      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --text-light: #94a3b8;
      --text-accent: #f87171;

      --border-color: #1f2937;
      --border-strong: #374151;

      --primary: #ef4444;
      --primary-hover: #f87171;
      --primary-focus: rgba(239, 68, 68, 0.35);

      --card-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.3);
      --card-shadow-hover: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      color: var(--text-main);
      background-color: var(--bg-body);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: var(--primary);
      text-decoration: none;
      transition: color var(--transition-fast);
    }

    a:hover {
      text-decoration: underline;
    }

    /* Layout */
    .app-container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .site-header {
      height: var(--header-height);
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.5rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .menu-toggle-btn {
      display: none;
      background: none;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 0.4rem;
      cursor: pointer;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      text-decoration: none;
      white-space: nowrap;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      fill: var(--primary);
    }

    .header-center {
      flex: 1;
      max-width: 440px;
      margin: 0 1.5rem;
      position: relative;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .search-input-wrapper svg {
      position: absolute;
      left: 0.75rem;
      width: 16px;
      height: 16px;
      fill: var(--text-light);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      height: 36px;
      padding: 0 2.2rem 0 2.2rem;
      border-radius: 9999px;
      border: 1px solid var(--border-color);
      background: var(--bg-sidebar);
      color: var(--text-main);
      font-size: 0.875rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .search-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-focus);
      background: var(--bg-surface);
    }

    .search-shortcut {
      position: absolute;
      right: 0.6rem;
      font-size: 0.7rem;
      padding: 0.15rem 0.35rem;
      background: var(--border-color);
      color: var(--text-muted);
      border-radius: 4px;
      pointer-events: none;
    }

    .search-results-dropdown {
      position: absolute;
      top: 42px;
      left: 0;
      right: 0;
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
      max-height: 420px;
      overflow-y: auto;
      display: none;
      z-index: 100;
    }

    .search-results-dropdown.active {
      display: block;
    }

    .search-result-item {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      display: block;
      color: var(--text-main);
    }

    .search-result-item:hover, .search-result-item.selected {
      background: var(--bg-muted);
      text-decoration: none;
    }

    .search-result-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--primary);
    }

    .search-result-snippet {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-icon {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 0.45rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .btn-icon:hover {
      background: var(--bg-muted);
      border-color: var(--border-strong);
    }

    .btn-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Main body layout */
    .app-main {
      display: flex;
      flex: 1;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      height: calc(100vh - var(--header-height));
      position: sticky;
      top: var(--header-height);
      overflow-y: auto;
      padding: 1.25rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .sidebar-section-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-light);
      padding: 0 0.75rem;
      margin-bottom: 0.35rem;
    }

    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 500;
      transition: all var(--transition-fast);
      text-decoration: none;
    }

    .nav-item a:hover {
      background: var(--bg-muted);
      color: var(--text-main);
    }

    .nav-item.active a {
      background: var(--bg-accent-subtle);
      color: var(--primary);
      font-weight: 600;
      border-left: 3px solid var(--primary);
    }

    .nav-num {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      opacity: 0.85;
      min-width: 1.8rem;
    }

    /* Content Area */
    .content-area {
      flex: 1;
      padding: 2.5rem 2rem 4rem 2rem;
      max-width: calc(var(--content-max-width) + 4rem);
      margin: 0 auto;
      width: 100%;
    }

    /* Hero / Header of doc */
    .doc-hero {
      margin-bottom: 2rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    .badge-category {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--primary);
      background: var(--bg-accent-subtle);
      border: 1px solid var(--bg-accent-border);
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      margin-bottom: 0.75rem;
    }

    .doc-title {
      font-size: 2.15rem;
      font-weight: 800;
      line-height: 1.2;
      color: var(--text-main);
      margin-bottom: 0.75rem;
      font-family: var(--font-sans);
    }

    .doc-meta-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-top: 1rem;
      font-size: 0.825rem;
      color: var(--text-light);
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.35rem 0.65rem;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-decoration: none;
    }

    .btn-action:hover {
      background: var(--bg-muted);
      color: var(--text-main);
      text-decoration: none;
    }

    .btn-action svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* Callout & Summary boxes */
    .summary-card {
      background: var(--bg-accent-subtle);
      border: 1px solid var(--bg-accent-border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2rem;
    }

    .summary-title {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--primary);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .summary-text {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Section Headings */
    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 2rem 0 1rem 0;
      padding-bottom: 0.4rem;
      border-bottom: 2px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Policy items grid/cards */
    .policy-items-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .policy-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      box-shadow: var(--card-shadow);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast);
      position: relative;
    }

    .policy-card:hover {
      box-shadow: var(--card-shadow-hover);
      border-color: var(--border-strong);
    }

    .policy-card-title {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--text-main);
      margin-bottom: 0.35rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .policy-card-bullet {
      width: 8px;
      height: 8px;
      background: var(--primary);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .policy-card-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.55;
    }

    /* Implementation card */
    .impl-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem 1.5rem;
      margin-bottom: 2.5rem;
    }

    .impl-title {
      font-size: 0.9rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-light);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .impl-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
    }

    /* Markdown rendered typography */
    .markdown-body {
      font-size: 1rem;
      color: var(--text-main);
      line-height: 1.7;
    }

    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: var(--text-main);
      margin-top: 1.8rem;
      margin-bottom: 0.8rem;
      font-weight: 700;
    }

    .markdown-body h1 { font-size: 1.85rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
    .markdown-body h2 { font-size: 1.4rem; }
    .markdown-body h3 { font-size: 1.15rem; }

    .markdown-body p {
      margin-bottom: 1rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 1.25rem;
      padding-left: 1.75rem;
    }

    .markdown-body li {
      margin-bottom: 0.4rem;
    }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      font-size: 0.875rem;
      overflow-x: auto;
      display: block;
    }

    .markdown-body th, .markdown-body td {
      padding: 0.65rem 0.9rem;
      border: 1px solid var(--border-color);
      text-align: left;
    }

    .markdown-body th {
      background: var(--bg-muted);
      font-weight: 700;
      color: var(--text-main);
    }

    .markdown-body td.num, .markdown-body th.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .markdown-body tr:nth-child(even) {
      background: var(--bg-sidebar);
    }

    .markdown-body blockquote {
      border-left: 4px solid var(--primary);
      padding: 0.5rem 1rem;
      background: var(--bg-accent-subtle);
      color: var(--text-muted);
      margin: 1rem 0;
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .markdown-body hr {
      border: 0;
      height: 1px;
      background: var(--border-color);
      margin: 2.5rem 0;
    }

    /* Table styles for Budget Model */
    .scenario-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.5rem;
    }

    .scenario-tab-btn {
      padding: 0.5rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .scenario-tab-btn:hover {
      background: var(--bg-muted);
      color: var(--text-main);
    }

    .scenario-tab-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    .metrics-summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .metric-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1rem;
      box-shadow: var(--card-shadow);
    }

    .metric-label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-light);
      margin-bottom: 0.35rem;
    }

    .metric-value {
      font-size: 1.45rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      color: var(--text-main);
    }

    .metric-subtext {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 0.2rem;
    }

    .table-responsive-wrapper {
      width: 100%;
      overflow-x: auto;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 2rem;
      background: var(--bg-surface);
      box-shadow: var(--card-shadow);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .data-table th, .data-table td {
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .data-table th {
      background: var(--bg-sidebar);
      font-weight: 700;
      color: var(--text-main);
      text-align: right;
    }

    .data-table th:first-child, .data-table td:first-child {
      text-align: left;
      font-weight: 600;
    }

    .data-table td {
      text-align: right;
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .data-table tbody tr:hover {
      background: var(--bg-muted);
    }

    .data-table tfoot tr {
      font-weight: 700;
      background: var(--bg-sidebar);
      border-top: 2px solid var(--border-strong);
    }

    .data-table tfoot td {
      color: var(--text-main);
    }

    /* Pagination / Next doc footer */
    .doc-nav-footer {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border-color);
    }

    .doc-nav-btn {
      display: flex;
      flex-direction: column;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      color: var(--text-main);
      text-decoration: none;
      transition: all var(--transition-fast);
      max-width: 48%;
    }

    .doc-nav-btn:hover {
      border-color: var(--primary);
      background: var(--bg-accent-subtle);
      text-decoration: none;
    }

    .doc-nav-label {
      font-size: 0.725rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text-light);
    }

    .doc-nav-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--primary);
      margin-top: 0.2rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .doc-nav-btn.next {
      text-align: right;
      margin-left: auto;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--text-main);
      color: var(--bg-body);
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    /* View Mode Toggler */
    .view-mode-toggle {
      display: inline-flex;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--bg-surface);
    }

    .view-mode-btn {
      padding: 0.3rem 0.65rem;
      background: none;
      border: none;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }

    .view-mode-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    /* Mobile Responsive */
    @media (max-width: 900px) {
      .sidebar {
        position: fixed;
        left: -100%;
        top: var(--header-height);
        height: calc(100vh - var(--header-height));
        z-index: 45;
        transition: left 0.25s ease;
        box-shadow: 10px 0 25px rgba(0,0,0,0.1);
      }

      .sidebar.open {
        left: 0;
      }

      .menu-toggle-btn {
        display: flex;
      }

      .content-area {
        padding: 1.5rem 1rem 3rem 1rem;
      }

      .header-center {
        display: none;
      }

      .header-center.mobile-open {
        display: block;
        position: absolute;
        top: var(--header-height);
        left: 0;
        right: 0;
        max-width: none;
        margin: 0;
        padding: 0.75rem 1rem;
        background: var(--bg-surface);
        border-bottom: 1px solid var(--border-color);
